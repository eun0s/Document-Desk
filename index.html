<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Document Desk</title>
<meta name="application-name" content="Document Desk">
<meta name="theme-color" content="#6e4526">
<meta name="description" content="A skeuomorphic writing desk with folders, sticky notes, a focus timer and ambient music.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#4a2c17;font-family:Lora,Georgia,serif;color:#2b1a0e}
.wood{background:
 repeating-linear-gradient(92deg,rgba(0,0,0,.07) 0 2px,transparent 2px 9px),
 repeating-linear-gradient(88deg,rgba(255,220,170,.06) 0 1px,transparent 1px 23px),
 linear-gradient(180deg,#8a5a34,#6e4526 60%,#7b4e2c)}
.shelf{background:
 repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 7px),
 linear-gradient(180deg,#a2703f,#7d522b);box-shadow:0 8px 0 #3d2412,0 18px 24px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,230,190,.35)}
.blotter{background:
 radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 60%),
 repeating-linear-gradient(45deg,rgba(0,0,0,.05) 0 1px,transparent 1px 4px),#3b3f3a;
 box-shadow:0 14px 30px rgba(0,0,0,.55),inset 0 0 0 6px #2a2d29,inset 0 0 0 7px rgba(255,255,255,.08)}
.paper{background:
 linear-gradient(transparent 31px,rgba(80,110,160,.22) 32px) 0 0/100% 32px,
 radial-gradient(circle at 20% 10%,#fffdf6,#f6efdc);box-shadow:0 6px 16px rgba(0,0,0,.45),0 1px 0 #fff inset}
.paper textarea{line-height:32px;background:transparent}
.manila{background:linear-gradient(180deg,#e8c982,#d6b268);box-shadow:0 5px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.sticky{background:linear-gradient(160deg,#fff08a,#f7d94a);box-shadow:0 10px 18px rgba(0,0,0,.45),inset 0 -20px 30px rgba(180,130,0,.12);transform:rotate(1.2deg)}
.metal{background:linear-gradient(180deg,#e9e3d8,#b9b0a1 50%,#d2cabb);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 #fff}
.metal:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.5);transform:translateY(1px)}
.strip{background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 1px,transparent 1px 6px),linear-gradient(180deg,#9a6a3b,#6a4122);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);box-shadow:inset 0 3px 0 rgba(255,230,190,.4)}
.hand{font-family:Caveat,'Comic Sans MS',cursive}
@keyframes bar{0%,100%{height:15%}50%{height:100%}}
.typed{font-family:'Special Elite','Courier New',monospace}
.slip{background:radial-gradient(circle at 20% 10%,#fffdf6,#efe6cf);box-shadow:0 20px 40px rgba(0,0,0,.6);animation:slip .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slip{from{transform:translateY(-50px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.tagtab{font-family:Caveat,cursive;font-size:20px;line-height:1}
.drawer{background:linear-gradient(180deg,#8d5d33,#5f3a1d);box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,230,190,.35)}
.btn{background:linear-gradient(180deg,#e9e3d8,#b9b0a1 50%,#d2cabb);box-shadow:0 2px 4px rgba(0,0,0,.4);border-radius:4px;padding:4px 12px;color:#2b1a0e;font-size:14px}
.btn:active{transform:translateY(1px)}
.night .paper{filter:sepia(.22) brightness(1.08);box-shadow:0 0 70px 8px rgba(255,185,90,.38),0 6px 16px rgba(0,0,0,.5)}
.night .blotter{position:relative;z-index:25;box-shadow:0 0 90px 10px rgba(255,170,70,.2),0 14px 30px rgba(0,0,0,.6),inset 0 0 0 6px #2a2d29,inset 0 0 0 7px rgba(255,255,255,.08)}
.lampbtn svg{overflow:visible}
.stampmark{font-family:'Special Elite','Courier New',monospace;position:absolute;pointer-events:none;border:3px double currentColor;border-radius:4px;padding:2px 10px;font-size:clamp(15px,2.4vw,24px);letter-spacing:.14em;opacity:.86;mix-blend-mode:multiply;filter:url(#ink);animation:thunk .28s ease-out;white-space:nowrap;font-weight:bold;transform:translate(-50%,-50%) rotate(var(--r,0deg))}
@keyframes thunk{from{transform:translate(-50%,-50%) scale(1.6) rotate(var(--r,0deg));opacity:0}}
@keyframes dropd{from{opacity:0;transform:translateY(-10px)}}
.drop{animation:dropd .25s ease-out}
@keyframes crumple{0%{transform:none;border-radius:2px;filter:none}35%{transform:scale(.5,.55) rotate(-7deg);border-radius:35%;filter:contrast(1.25) brightness(.93)}70%{transform:scale(.2) rotate(30deg);border-radius:50%}100%{transform:scale(.1) rotate(80deg);border-radius:50%}}
.ball{background:radial-gradient(circle at 35% 30%,#fff,#ebe3cd 55%,#b9ae92);clip-path:polygon(50% 0,70% 8%,95% 25%,100% 55%,85% 85%,55% 100%,25% 92%,5% 65%,0 35%,22% 8%);animation:toss .75s cubic-bezier(.35,0,.7,.7) forwards}
@keyframes toss{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(calc(var(--dx)*.55),calc(var(--dy)*.5 - 110px)) scale(.9) rotate(260deg)}100%{transform:translate(var(--dx),var(--dy)) scale(.55) rotate(520deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.wiggle{animation:wiggle .5s}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef,useMemo}=React;
const html=htm.bind(React.createElement);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){let ok=true;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){ok=false}try{dispatchEvent(new CustomEvent('desk-save',{detail:ok}))}catch(e){}}};

const uid=()=>Math.random().toString(36).slice(2,9);
const DEF_FOLDERS=[{id:'f1',name:'Drafts'},{id:'f2',name:'Research'},{id:'f3',name:'Reading'},{id:'f4',name:'Archive'}];
const DEF_TAGS=['Writing','Reading','Ideas'];
const LEGACY_SEED=[
 {id:1,folder:'f1',tag:'Writing',star:true,title:'Chapter Three: The Lighthouse',body:'The lamp had not been lit in eleven winters, but Marta climbed the stairs anyway, one hand on the cold iron rail.\n\nAt the top, the glass was fogged with salt.'},
 {id:2,folder:'f1',tag:'Ideas',star:false,title:'Essay outline: slow reading',body:'1. Why we skim\n2. What a margin note does\n3. A case for paper'},
 {id:3,folder:'f2',tag:'Reading',star:true,title:'Notes on tide tables',body:'Spring tides follow new and full moons. Check the almanac for the harbour entry.'},
 {id:4,folder:'f3',tag:'Reading',star:false,title:'The Gutenberg Parenthesis',body:'Highlights to revisit: oral culture, print, and what comes after.'},
 {id:5,folder:'f4',tag:'Writing',star:false,title:'Old letter to Samir',body:'Dear Samir, I never did send this one. The weather here has finally turned.'}
];
const SEED=[];
const loadDocs=()=>ls.get('desk.docs',SEED).map(d=>{const f=DEF_FOLDERS.find(x=>x.name===d.folder);return f?{...d,folder:f.id}:d});

(()=>{const st=d=>({id:d.id,folder:d.folder,tag:d.tag,star:d.star,title:d.title,body:d.body});
 const d=ls.get('desk.docs',null);
 if(d&&JSON.stringify(loadDocs().map(st))===JSON.stringify(LEGACY_SEED.map(st))){
  ls.set('desk.docs',[]);
  if(JSON.stringify(ls.get('desk.folders',null))===JSON.stringify(DEF_FOLDERS))ls.set('desk.folders',[]);
  if(JSON.stringify(ls.get('desk.tags',null))===JSON.stringify(DEF_TAGS))ls.set('desk.tags',[]);
  if(ls.get('desk.sticky',null)==='Call the printer\nBuy ink + stamps\nFinish ch. 3 by Fri')ls.set('desk.sticky','')}})();
/* ---------- audio ---------- */
function chime(){try{const AC=window.AudioContext||window.webkitAudioContext;const c=new AC();[660,880,1100].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,c.currentTime+i*.25);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.25+.9);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.25);o.stop(c.currentTime+i*.25+1)})}catch(e){}}
function parseYT(u){try{const x=new URL(u),h=x.hostname.replace('www.','');let id=null;const list=x.searchParams.get('list');
 if(h==='youtu.be')id=x.pathname.slice(1);
 else if(h.endsWith('youtube.com')||h.endsWith('youtube-nocookie.com'))id=x.searchParams.get('v')||(x.pathname.match(/^\/(?:live|embed|shorts)\/([\w-]+)/)||[])[1];
 else return null;
 if(id&&id!=='videoseries')return 'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1'+(list?'&list='+list:'');
 if(list)return 'https://www.youtube-nocookie.com/embed/videoseries?autoplay=1&list='+list;return null}catch(e){return null}}

/* ---------- clock ---------- */
function Clock(){
 const [t,setT]=useState(new Date());
 useEffect(()=>{const i=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(i)},[]);
 const s=t.getSeconds(),m=t.getMinutes()+s/60,h=(t.getHours()%12)+m/60;
 const hand=(a,l,w,c)=>html`<line x1="50" y1="50" x2=${50+l*Math.sin(a*Math.PI/180)} y2=${50-l*Math.cos(a*Math.PI/180)} stroke=${c} strokeWidth=${w} strokeLinecap="round"/>`;
 return html`<div className="flex flex-col items-center shrink-0" title=${t.toLocaleDateString()}>
  <svg viewBox="0 0 100 100" className="w-20 h-20 md:w-24 md:h-24 drop-shadow-[0_6px_6px_rgba(0,0,0,.55)]">
   <circle cx="50" cy="50" r="48" fill="#3a2212"/><circle cx="50" cy="50" r="44" fill="#c9a24a"/><circle cx="50" cy="50" r="41" fill="#fbf5e4"/>
   ${[...Array(12)].map((_,i)=>html`<line key=${i} x1=${50+34*Math.sin(i*Math.PI/6)} y1=${50-34*Math.cos(i*Math.PI/6)} x2=${50+39*Math.sin(i*Math.PI/6)} y2=${50-39*Math.cos(i*Math.PI/6)} stroke="#3a2212" strokeWidth=${i%3?1:2}/>`)}
   ${hand(h*30,22,3.2,'#2b1a0e')}${hand(m*6,32,2.2,'#2b1a0e')}${hand(s*6,35,.8,'#a8321f')}
   <circle cx="50" cy="50" r="2.5" fill="#a8321f"/>
  </svg>
  <div className="text-[11px] text-amber-100/90 mt-0.5 tabular-nums">${t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
 </div>`;
}

/* ---------- sticky ---------- */
function Sticky(){
 const [v,setV]=useState(()=>ls.get('desk.sticky',''));
 useEffect(()=>ls.set('desk.sticky',v),[v]);
 return html`<div className="sticky rounded-sm p-3 pt-5 relative flex-1 min-h-[170px] flex flex-col">
  <div className="absolute -top-2 left-1/2 -translate-x-1/2 w-16 h-4 bg-white/40 rotate-[-2deg] shadow"></div>
  <textarea value=${v} onChange=${e=>setV(e.target.value)} placeholder="Jot something down…" aria-label="Sticky note"
   className="hand flex-1 w-full resize-none bg-transparent outline-none text-2xl leading-7 text-[#3b2a05] placeholder-[#3b2a05]/40"/>
 </div>`;
}

/* ---------- pomodoro ---------- */
const DEF_CFG={focus:25,break:5,long:15},MODE_L={focus:'Focus',break:'Break',long:'Long'};
const WOOD='repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 2px,transparent 2px 9px),linear-gradient(180deg,#a2703f,#6e4526)';
function Pomodoro(){
 const init=useMemo(()=>{const c={...DEF_CFG,...ls.get('desk.pomoCfg',{})},t=ls.get('desk.timer',null);
  if(!t||!MODE_L[t.mode])return {mode:'focus',left:c.focus*60,run:false,done:0};
  return t.run?{...t,left:Math.max(0,Math.ceil((t.endAt-Date.now())/1000))}:t},[]);
 const [cfg,setCfg]=useState(()=>({...DEF_CFG,...ls.get('desk.pomoCfg',{})})),[open,setOpen]=useState(()=>ls.get('desk.pomoOpen',true)),[edit,setEdit]=useState(false);
 const [mode,setMode]=useState(init.mode),[left,setLeft]=useState(init.left),[run,setRun]=useState(init.run),[done,setDone]=useState(init.done);
 const endAt=useRef(Date.now()+init.left*1000);
 useEffect(()=>{ls.set('desk.pomoCfg',cfg)},[cfg]);
 useEffect(()=>{ls.set('desk.pomoOpen',open)},[open]);
 useEffect(()=>{if(!run)return;endAt.current=Date.now()+left*1000;const i=setInterval(()=>setLeft(Math.max(0,Math.ceil((endAt.current-Date.now())/1000))),500);return()=>clearInterval(i)},[run]);
 useEffect(()=>{ls.set('desk.timer',{mode,left,run,done,endAt:endAt.current})},[mode,left,run,done]);
 useEffect(()=>{if(left<=0&&run){chime();if(mode==='focus'){const d=done+1;setDone(d);pick(d%4===0?'long':'break')}else pick('focus')}},[left]);
 const pick=m=>{setMode(m);setRun(false);setLeft(cfg[m]*60)};
 const setMin=(k,v)=>{const n=Math.max(1,Math.min(180,Math.round(+v)||1));setCfg(c=>({...c,[k]:n}));if(k===mode&&!run)setLeft(n*60)};
 const frac=Math.max(0,Math.min(1,left/(cfg[mode]*60))),R=40,C=2*Math.PI*R;
 const mm=String(Math.floor(left/60)).padStart(2,'0'),ss=String(left%60).padStart(2,'0');
 return html`<div className="rounded-lg overflow-hidden" style=${{background:WOOD,boxShadow:'0 12px 20px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,230,190,.35)'}}>
  <div className="flex items-center gap-2 px-3 py-1.5">
   <button onClick=${()=>setOpen(!open)} aria-expanded=${open} aria-label=${open?'Compact the timer':'Drop the timer down'} className="flex items-center gap-2 flex-1 min-w-0 text-left">
    <span className="text-amber-100 text-xs" style=${{display:'inline-block',transition:'transform .2s',transform:open?'none':'rotate(-90deg)'}}>▾</span>
    <span className="hand text-xl text-amber-100 leading-none">Pomodoro</span>
    ${!open&&html`<span className="typed text-amber-100 text-sm tabular-nums ml-auto">${mm}:${ss}</span>`}</button>
   ${!open&&html`<button onClick=${()=>setRun(!run)} aria-label=${run?'Pause':'Start'} className="metal rounded-full w-7 h-7 text-xs text-stone-800">${run?'⏸':'▶'}</button>`}
  </div>
  ${open&&html`<div className="drop px-3 pb-3 flex flex-col items-center">
   <div className="flex gap-1 mb-2">${Object.keys(MODE_L).map(k=>html`<button key=${k} onClick=${()=>pick(k)} className=${'typed px-2.5 py-0.5 text-xs rounded '+(mode===k?'bg-[#f4ecd8] text-stone-900 shadow':'bg-black/25 text-amber-100 hover:bg-black/35')}>${MODE_L[k]}</button>`)}</div>
   <div className="relative w-36 h-36">
    <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90 drop-shadow-[0_4px_5px_rgba(0,0,0,.45)]">
     <circle cx="50" cy="50" r="47" fill="#5a3a1d"/><circle cx="50" cy="50" r="44" fill="#b8902f"/><circle cx="50" cy="50" r="41" fill="#f4ecd8"/>
     <circle cx="50" cy="50" r=${R} fill="none" stroke="#e3d6b4" strokeWidth="7"/>
     <circle cx="50" cy="50" r=${R} fill="none" stroke=${mode==='focus'?'#8c2f1b':'#4f6b3a'} strokeWidth="7" strokeDasharray=${C} strokeDashoffset=${C*(1-frac)} strokeLinecap="round" style=${{transition:'stroke-dashoffset 1s linear'}}/>
    </svg>
    <div className="absolute inset-0 flex flex-col items-center justify-center"><div className="typed text-3xl tabular-nums text-[#3a2a14]">${mm}:${ss}</div><div className="typed text-[11px] text-[#6b5326]">${MODE_L[mode]}, ${done} done</div></div>
   </div>
   <div className="flex gap-2 mt-2">
    <button onClick=${()=>setRun(!run)} className="metal rounded px-4 py-1 text-sm font-semibold text-stone-800">${run?'Pause':'Start'}</button>
    <button onClick=${()=>pick(mode)} className="metal rounded px-3 py-1 text-sm text-stone-800">Reset</button>
    <button onClick=${()=>setEdit(!edit)} aria-pressed=${edit} title="Set the times" aria-label="Set the times" className=${'metal rounded px-2 py-1 text-sm text-stone-800 '+(edit?'ring-2 ring-amber-300':'')}>⚙</button></div>
   ${edit&&html`<div className="drop slip typed mt-2 rounded-sm px-3 py-2 text-xs text-stone-800 flex items-center gap-2 flex-wrap justify-center">
    ${Object.keys(MODE_L).map(k=>html`<label key=${k} className="flex items-center gap-1">${MODE_L[k]}<input type="number" min="1" max="180" value=${cfg[k]} onChange=${e=>setMin(k,e.target.value)} className="typed w-11 bg-white/60 border-b-2 border-stone-600 text-center outline-none"/></label>`)}<span className="text-stone-500">min</span></div>`}
  </div>`}
 </div>`;
}

/* ---------- media strip ---------- */
function Radio({tracks,i,on,onAdd,onPlay,onRm,onClose}){
 const [url,setUrl]=useState(''),[name,setName]=useState(''),[err,setErr]=useState('');
 const go=()=>{const r=onAdd(url,name.trim());if(r)setErr(r);else onClose()};
 const kind={synth:'synth',file:'file',stream:'radio',yt:'video'};
 const line='typed w-full bg-transparent border-b-2 border-stone-700 outline-none py-1';
 return html`<${Modal} title="Radio dial" onClose=${onClose}>
  <label className="text-sm text-stone-600">Station link: a YouTube video or live stream, or a direct audio URL</label>
  <input autoFocus value=${url} onChange=${e=>setUrl(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&go()} placeholder="https://…" className=${line+' mt-1'}/>
  <input value=${name} onChange=${e=>setName(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&go()} placeholder="Label (optional)" maxLength="40" className=${line+' mt-2 text-sm'}/>
  ${err&&html`<p className="text-xs mt-1 text-red-800">${err}</p>`}
  <${Row}><button className="btn" onClick=${onClose}>Close</button><button className="btn font-semibold" onClick=${go}>Tune in</button><//>
  <div className="mt-4 pt-2 border-t border-dashed border-stone-400"><div className="text-sm mb-1">On the shelf</div>
   <ul className="max-h-40 overflow-y-auto text-sm">${!tracks.length&&html`<li className="text-stone-500">Nothing on the shelf yet.</li>`}${tracks.map((t,k)=>html`<li key=${t.id} className="flex items-center gap-2 py-0.5">
    <button onClick=${()=>{onPlay(k);onClose()}} className=${'flex-1 text-left truncate hover:underline '+(k===i?'font-bold':'')}>${k===i&&on?'▶ ':''}${t.name} <span className="text-stone-500 text-xs">(${kind[t.kind]})</span></button>
    ${t.kind!=='synth'&&html`<button aria-label=${'Remove '+t.name} onClick=${()=>onRm(t.id)} className="text-xs hover:text-red-700">✕</button>`}</li>`)}</ul>
   <p className="text-xs text-stone-500 mt-1">Load audio files with the ⏏ button; they last until you close the tab. Station links are remembered.</p></div><//>`;
}
function MediaStrip(){
 const [tracks,setTracks]=useState(()=>ls.get('desk.streams',[]));
 const [i,setI]=useState(0),[on,setOn]=useState(false),[vol,setVol]=useState(()=>ls.get('desk.vol',0.6)),[msg,setMsg]=useState(''),[yt,setYt]=useState(null),[dlg,setDlg]=useState(false),[url,setUrl]=useState(''),[showUrl,setShowUrl]=useState(false);
 const a=useRef(null),fileIn=useRef(null);
 const [ytn,setYtn]=useState(0);
 const curEl=useRef(null),ytRef=useRef(null),lastPrev=useRef(0),holdRef=useRef(null),ac=useRef(null),ctxR=useRef(null),meter=useRef('sim'),curRef=useRef(null),needle=useRef(null);
 if(!a.current)a.current=new Audio();
 if(!ac.current){ac.current=new Audio();ac.current.crossOrigin='anonymous'}
 const cur=tracks[i]||tracks[0]||{name:'No music loaded'};
 useEffect(()=>{let raf,v=0,t=Math.random()*10;const loop=()=>{t+=.05;let tg=0;
  if(on){const x=ctxR.current;
   if(meter.current==='real'&&x){x.an.getByteTimeDomainData(x.buf);let sm=0;for(let k=0;k<x.buf.length;k++){const d=(x.buf[k]-128)/128;sm+=d*d}tg=Math.min(1,Math.max(0,(20*Math.log10(Math.sqrt(sm/x.buf.length)+1e-4)+42)/42))}
   else tg=Math.max(.05,.5+.22*Math.sin(t*1.7)+.16*Math.sin(t*4.1+1)+.1*Math.sin(t*9.3)+.06*Math.sin(t*17))}
  v+=(tg-v)*(tg>v?.4:.1);if(needle.current)needle.current.style.transform='rotate('+(-50+Math.min(1,v)*100)+'deg)';raf=requestAnimationFrame(loop)};loop();return()=>cancelAnimationFrame(raf)},[on]);
 useEffect(()=>{ls.set('desk.streams',tracks.filter(t=>t.kind==='stream'||t.kind==='yt'))},[tracks]);
 useEffect(()=>{ls.set('desk.vol',vol);a.current.volume=vol;ac.current.volume=vol},[vol]);
 const halt=()=>{a.current.pause();ac.current.pause();setYt(null)};

       <button onClick=${()=>setHlColor('erase')} aria-pressed=${hlColor==='erase'} className=${'px-2 h-6 rounded '+(hlColor==='erase'?'bg-stone-800 text-amber-100':'bg-black/10')}>eraser</button>
       <label className="flex items-center gap-1"><input type="checkbox" checked=${lens} onChange=${e=>setLens(e.target.checked)}/>magnifier</label>
       <span className="flex-1"></span>${(cur.hl||[]).length>0&&html`<button className="underline" onClick=${()=>upd(cur.id,{hl:[]})}>clear highlights</button>`}</div>`}
      ${view==='write'?html`<textarea ref=${taRef} value=${cur.body} onChange=${e=>upd(cur.id,{body:e.target.value})} onSelect=${e=>{const t=e.target.value.slice(e.target.selectionStart,e.target.selectionEnd).trim();setSelW(t?t.split(/\s+/).length:0)}} onKeyDown=${e=>{if((e.ctrlKey||e.metaKey)&&(e.key==='b'||e.key==='i')){e.preventDefault();fmt(e.key)}}} placeholder="Start writing… (Markdown works: **bold**, *italic*, # heading, - list)" aria-label="Page text" className="flex-1 min-h-[240px] md:min-h-0 w-full resize-none outline-none pl-3 text-[17px] text-stone-800"/>`:view==='preview'?html`<div className="flex-1 min-h-[240px] md:min-h-0 overflow-y-auto pl-3 pr-1 text-stone-800"><${Md} text=${cur.body}/></div>`:html`<${Mark} doc=${cur} color=${hlColor} lens=${lens} onChange=${hl=>upd(cur.id,{hl})}/>`}
      <${CitePad} doc=${cur} onChange=${c=>upd(cur.id,{cites:c})} onInsert=${insertAt}/>
      <div className="typed text-xs text-stone-600 pl-3 mt-1 pt-1 border-t border-stone-300/70 flex flex-wrap gap-x-4 gap-y-1 items-center">
       <span title="Words, characters and estimated reading time"><b className="text-stone-800">${words}</b> ${words===1?'word':'words'}, ${chars} characters, about ${mins} min read${selW>0&&view==='write'?', '+selW+' selected':''}</span>
       <span className="flex-1"></span>
       <label>folder <select value=${cur.folder} onChange=${e=>{upd(cur.id,{folder:e.target.value});setSel(null)}} className="bg-transparent border-b border-stone-400">${folders.map(f=>html`<option key=${f.id} value=${f.id}>${f.name}</option>`)}</select></label>
       <label>tag <select value=${cur.tag} onChange=${e=>upd(cur.id,{tag:e.target.value})} className="bg-transparent border-b border-stone-400"><option value="">untagged</option>${tags.map(t=>html`<option key=${t} value=${t}>${t}</option>`)}</select></label>${(cur.stamps||[]).length>0&&html`<button className="underline" onClick=${()=>upd(cur.id,{stamps:[]})}>clear stamps</button>`}</div>
     </div>`:html`<div className="paper flex-1 rounded-sm flex items-center justify-center text-stone-600 text-center p-8">${!fid?'No folders yet. Add one on the left.':list.length?'Pick a page above.':'No pages in “'+fname+'” for “'+q+'”. Add one with “+ New page” or change the filter.'}</div>`}
   </section>

   <aside className="flex flex-col gap-5 md:overflow-y-auto md:min-h-0 md:pr-1 md:pb-2" aria-label="Widgets"><${Sticky} key=${'s'+rev}/><${Pomodoro} key=${'p'+rev}/></aside>
  </main>

  <footer className="shrink-0 relative z-10 flex flex-wrap sm:flex-nowrap items-end justify-between gap-x-2 gap-y-3 px-3 md:px-6 pt-4 pb-1">
   <div className="flex flex-col items-start gap-0.5 shrink-0">
    <span className=${'hand text-base leading-none '+(sv.ok?'text-amber-100/80':'text-red-300')}>${sv.ok?'✓ saved'+(sv.t?' '+sv.t:''):'⚠ not saved: back up via the drawer'}</span>
    <button onClick=${()=>setModal({k:'drawer'})} aria-label="Open desk drawer for backup and restore" className="drawer w-20 h-10 rounded-t flex flex-col items-center justify-center gap-0.5 hover:-translate-y-1 transition-transform">
     <span className="hand text-amber-100 text-sm leading-none">drawer</span><span className="metal rounded-full w-12 h-2.5 block"></span></button>
   </div>
   <${MediaStrip}/>
   <div className="flex flex-col items-center shrink-0">
    <button ref=${trashRef} onClick=${()=>setModal({k:'bin'})} aria-label=${'Wastepaper bin, '+trash.length+' pages'} title="Wastepaper bin" className=${'relative '+(wig?'wiggle':'')}>
     <svg viewBox="0 0 48 56" className="w-10 h-12 drop-shadow-[0_4px_4px_rgba(0,0,0,.6)]">
      <defs><pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H6M0 0V6" stroke="#cfd3d6" strokeWidth="1"/></pattern></defs>
      ${trash.length>0&&html`<circle cx="18" cy="12" r="6" fill="#efe7d2"/><circle cx="29" cy="10" r="5" fill="#f6f0df"/>`}
      <path d="M5 12 H43 L39 52 Q38 54 36 54 H12 Q10 54 9 52 Z" fill="#2a2d30" fillOpacity=".55" stroke="#aeb4b8" strokeWidth="1.6"/>
      <path d="M5 12 H43 L39 52 Q38 54 36 54 H12 Q10 54 9 52 Z" fill="url(#mesh)"/>
      <ellipse cx="24" cy="12" rx="19" ry="3.4" fill="none" stroke="#d8dde0" strokeWidth="2"/><path d="M10 54 H38" stroke="#8d9396" strokeWidth="2.4"/></svg>
     ${trash.length>0&&html`<span className="absolute -top-1 -right-1 bg-[#b3261e] text-white text-[10px] rounded-full min-w-[18px] h-[18px] flex items-center justify-center typed">${trash.length}</span>`}
    </button><span className="hand text-amber-100 text-xs leading-none">bin</span>
   </div>
  </footer>
  ${modal&&modal.k==='ask'&&html`<${Ask} ...${modal} onClose=${()=>setModal(null)}/>`}
  ${modal&&modal.k==='sure'&&html`<${Sure} ...${modal} onClose=${()=>setModal(null)}/>`}
  ${modal&&modal.k==='fdel'&&html`<${FolderDel} ...${modal} onClose=${()=>setModal(null)}/>`}
  ${calc&&html`<${Calc} doc=${cur} pos=${calcPos} setPos=${setCalcPos} onClose=${()=>setCalc(false)}/>`}
  ${modal&&modal.k==='tpl'&&html`<${TplModal} onPick=${makeDoc} onClose=${()=>setModal(null)}/>`}
  ${modal&&modal.k==='search'&&html`<${SearchModal} docs=${docs} folders=${folders} tags=${tags} sticky=${ls.get('desk.sticky','')} onPage=${d=>{setFolder(d.folder);setQ('All');setSel(d.id);setView('write');setModal(null)}} onTag=${t=>{setQ(t);setModal(null)}} onFolder=${f=>{setFolder(f.id);setSel(null);setModal(null)}} onSticky=${()=>{setModal(null);setTimeout(()=>{const el=document.querySelector('textarea[aria-label="Sticky note"]');if(el){el.focus()}},60)}} onClose=${()=>setModal(null)}/>`}
  ${modal&&modal.k==='bin'&&html`<${BinModal} trash=${trash} onRestore=${restore} onForget=${id=>setTrash(t=>t.filter(x=>x.id!==id))} onEmpty=${()=>setTrash([])} onClose=${()=>setModal(null)}/>`}
  ${modal&&modal.k==='drawer'&&html`<${Drawer} install=${ip?()=>{ip.prompt();setIp(null)}:null} dump=${dump} onImport=${importer} onReset=${()=>{setModal(null);reset()}} onClose=${()=>setModal(null)}/>`}
 </div>`;
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
